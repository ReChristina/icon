<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="基于 Figma 登录页设计实现的响应式 Tailwind CSS HTML 页面"
    />
    <title>登录页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "BlinkMacSystemFont",
                "Segoe UI",
                "sans-serif",
              ],
            },
            boxShadow: {
              soft: "0 28px 80px rgba(31, 41, 55, 0.14)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#f5f8ff] font-sans text-slate-900 antialiased">
    <main
      class="relative isolate flex min-h-screen items-center justify-center overflow-hidden px-4 py-8 sm:px-6 lg:px-8"
    >
      <div
        class="absolute left-1/2 top-0 -z-10 h-[34rem] w-[34rem] -translate-x-1/2 rounded-full bg-sky-200/50 blur-3xl"
        aria-hidden="true"
      ></div>
      <div
        class="absolute bottom-[-12rem] right-[-8rem] -z-10 h-[30rem] w-[30rem] rounded-full bg-indigo-200/60 blur-3xl"
        aria-hidden="true"
      ></div>

      <section
        aria-labelledby="login-title"
        class="grid w-full max-w-6xl overflow-hidden rounded-[2rem] bg-white shadow-soft ring-1 ring-slate-200/70 lg:min-h-[44rem] lg:grid-cols-[1.06fr_0.94fr]"
      >
        <aside
          class="relative overflow-hidden bg-gradient-to-br from-[#377dff] via-[#5d5fef] to-[#7c3aed] px-6 py-8 text-white sm:px-10 lg:flex lg:flex-col lg:justify-between lg:p-12"
          aria-label="产品介绍"
        >
          <div
            class="absolute -left-24 top-16 h-72 w-72 rounded-full bg-white/10 blur-2xl"
            aria-hidden="true"
          ></div>
          <div
            class="absolute -bottom-28 right-[-4rem] h-80 w-80 rounded-full bg-cyan-300/25 blur-3xl"
            aria-hidden="true"
          ></div>

          <header class="relative z-10 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3" aria-label="Flow Cloud 首页">
              <span
                class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/20 shadow-lg shadow-indigo-950/10 ring-1 ring-white/30 backdrop-blur"
                aria-hidden="true"
              >
                <svg
                  class="h-6 w-6"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M5 12.8C5 8.5 8.5 5 12.8 5H19v6.2c0 4.3-3.5 7.8-7.8 7.8H5v-6.2Z"
                    fill="currentColor"
                    opacity=".92"
                  />
                  <path
                    d="M8.3 12.8a4.5 4.5 0 0 1 4.5-4.5h3.1v3.1a4.5 4.5 0 0 1-4.5 4.5H8.3v-3.1Z"
                    fill="#377DFF"
                  />
                </svg>
              </span>
              <span class="text-lg font-semibold tracking-tight">Flow Cloud</span>
            </a>

            <span
              class="rounded-full bg-white/15 px-4 py-2 text-sm font-medium text-white/90 ring-1 ring-white/20 backdrop-blur"
            >
              Smart Login
            </span>
          </header>

          <div class="relative z-10 mt-12 max-w-xl lg:mt-0">
            <p class="text-sm font-semibold uppercase tracking-[0.24em] text-cyan-100">
              Welcome back
            </p>
            <h1
              class="mt-4 max-w-lg text-4xl font-bold leading-tight tracking-[-0.04em] sm:text-5xl"
            >
              登录你的账号，继续高效协作
            </h1>
            <p class="mt-5 max-w-md text-base leading-8 text-blue-50/90">
              安全访问团队空间、项目看板与数据洞察，让每一次登录都快速、清晰且可信赖。
            </p>
          </div>

          <div class="relative z-10 mt-10 lg:mt-0">
            <div
              class="mx-auto max-w-[28rem] rounded-[2rem] bg-white/16 p-4 shadow-2xl shadow-indigo-950/20 ring-1 ring-white/25 backdrop-blur-md"
            >
              <div class="rounded-[1.5rem] bg-white p-4 text-slate-900 shadow-xl">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-sm font-semibold text-slate-500">本月效率</p>
                    <p class="mt-1 text-3xl font-bold tracking-tight">92%</p>
                  </div>
                  <span
                    class="rounded-full bg-emerald-50 px-3 py-1 text-sm font-semibold text-emerald-600"
                  >
                    +18%
                  </span>
                </div>

                <div class="mt-6 grid grid-cols-7 items-end gap-2" aria-hidden="true">
                  <span class="h-16 rounded-full bg-blue-100"></span>
                  <span class="h-24 rounded-full bg-blue-200"></span>
                  <span class="h-14 rounded-full bg-blue-100"></span>
                  <span class="h-28 rounded-full bg-[#377dff]"></span>
                  <span class="h-20 rounded-full bg-blue-200"></span>
                  <span class="h-32 rounded-full bg-indigo-500"></span>
                  <span class="h-24 rounded-full bg-blue-200"></span>
                </div>

                <div class="mt-6 grid gap-3">
                  <div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3">
                    <span
                      class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600"
                      aria-hidden="true"
                    >
                      <svg
                        class="h-5 w-5"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M10 2a8 8 0 1 0 8 8 1 1 0 1 0-2 0 6 6 0 1 1-1.76-4.24 1 1 0 1 0 1.42-1.42A7.98 7.98 0 0 0 10 2Z"
                        />
                        <path
                          d="M10.8 6.6a1 1 0 0 0-1.6-1.2l-2.5 3.33A1 1 0 0 0 7.5 10.33H10a1 1 0 0 0 .8-.4l3.5-4.67a1 1 0 1 0-1.6-1.2L9.5 8.33h-.02l1.32-1.73Z"
                        />
                      </svg>
                    </span>
                    <div class="min-w-0 flex-1">
                      <p class="text-sm font-semibold">安全验证已开启</p>
                      <p class="text-xs text-slate-500">企业级登录保护</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3">
                    <span
                      class="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 text-violet-600"
                      aria-hidden="true"
                    >
                      <svg
                        class="h-5 w-5"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M4 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm3 2a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2H7Zm0 4a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2H7Zm0 4a1 1 0 1 0 0 2h3a1 1 0 1 0 0-2H7Z"
                        />
                      </svg>
                    </span>
                    <div class="min-w-0 flex-1">
                      <p class="text-sm font-semibold">待办事项同步</p>
                      <p class="text-xs text-slate-500">登录后继续上次工作</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <div class="flex items-center justify-center px-6 py-10 sm:px-10 lg:px-14">
          <article class="w-full max-w-md">
            <header>
              <p class="text-sm font-semibold text-[#377dff]">账号登录</p>
              <h2
                id="login-title"
                class="mt-3 text-3xl font-bold tracking-[-0.03em] text-slate-950 sm:text-4xl"
              >
                欢迎回来
              </h2>
              <p class="mt-3 text-sm leading-6 text-slate-500">
                请输入账号信息，登录后即可访问你的工作台。
              </p>
            </header>

            <form class="mt-9 space-y-5" action="#" method="post">
              <div>
                <label for="email" class="block text-sm font-semibold text-slate-700">
                  邮箱地址
                </label>
                <div class="relative mt-2">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-slate-400"
                    aria-hidden="true"
                  >
                    <svg
                      class="h-5 w-5"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M3 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2.4-.2a1 1 0 0 0-.8 1.8l4.9 3.06a1 1 0 0 0 1.06 0l4.86-3.04a1 1 0 1 0-1.06-1.7L10 7.65 5.4 4.8Z"
                      />
                    </svg>
                  </span>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="name@example.com"
                    required
                    class="block w-full rounded-2xl border-0 bg-slate-50 py-4 pl-12 pr-4 text-base text-slate-900 outline-none ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-[#377dff]"
                  />
                </div>
              </div>

              <div>
                <div class="flex items-center justify-between">
                  <label for="password" class="block text-sm font-semibold text-slate-700">
                    密码
                  </label>
                  <a
                    href="#"
                    class="text-sm font-semibold text-[#377dff] transition hover:text-indigo-600"
                  >
                    忘记密码？
                  </a>
                </div>
                <div class="relative mt-2">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-slate-400"
                    aria-hidden="true"
                  >
                    <svg
                      class="h-5 w-5"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M5 8V6a5 5 0 0 1 10 0v2h.25A1.75 1.75 0 0 1 17 9.75v5.5A1.75 1.75 0 0 1 15.25 17H4.75A1.75 1.75 0 0 1 3 15.25v-5.5C3 8.78 3.78 8 4.75 8H5Zm2 0h6V6a3 3 0 1 0-6 0v2Z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </span>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入密码"
                    required
                    class="block w-full rounded-2xl border-0 bg-slate-50 py-4 pl-12 pr-4 text-base text-slate-900 outline-none ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-[#377dff]"
                  />
                </div>
              </div>

              <div class="flex items-center justify-between gap-4">
                <label class="flex cursor-pointer items-center gap-3 text-sm text-slate-600">
                  <input
                    type="checkbox"
                    name="remember"
                    class="h-4 w-4 rounded border-slate-300 text-[#377dff] focus:ring-[#377dff]"
                  />
                  记住我
                </label>
                <span class="hidden text-sm text-slate-400 sm:inline">安全连接</span>
              </div>

              <button
                type="submit"
                class="flex w-full items-center justify-center rounded-2xl bg-[#377dff] px-5 py-4 text-base font-semibold text-white shadow-lg shadow-blue-500/30 transition hover:-translate-y-0.5 hover:bg-[#286ee8] focus:outline-none focus:ring-4 focus:ring-blue-200"
              >
                登录
              </button>
            </form>

            <div class="my-8 flex items-center gap-4" aria-hidden="true">
              <span class="h-px flex-1 bg-slate-200"></span>
              <span class="text-sm text-slate-400">或</span>
              <span class="h-px flex-1 bg-slate-200"></span>
            </div>

            <div class="grid gap-3 sm:grid-cols-2">
              <a
                href="#"
                class="inline-flex items-center justify-center gap-3 rounded-2xl bg-white px-4 py-3 text-sm font-semibold text-slate-700 ring-1 ring-slate-200 transition hover:bg-slate-50"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M18.17 10.2c0-.65-.06-1.27-.17-1.86h-7.82v3.52h4.47a3.83 3.83 0 0 1-1.66 2.51v2.28h2.69c1.57-1.45 2.49-3.58 2.49-6.45Z"
                    fill="#4285F4"
                  />
                  <path
                    d="M10.18 18.33c2.24 0 4.12-.74 5.5-2.01l-2.69-2.28c-.75.5-1.7.8-2.81.8-2.16 0-3.99-1.46-4.64-3.42H2.76v2.35a8.3 8.3 0 0 0 7.42 4.56Z"
                    fill="#34A853"
                  />
                  <path
                    d="M5.54 11.42a4.98 4.98 0 0 1 0-3.17V5.9H2.76a8.32 8.32 0 0 0 0 7.87l2.78-2.35Z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M10.18 4.83c1.22 0 2.32.42 3.18 1.24l2.38-2.38a8 8 0 0 0-5.56-2.02A8.3 8.3 0 0 0 2.76 6.23l2.78 2.35c.65-1.96 2.48-3.75 4.64-3.75Z"
                    fill="#EA4335"
                  />
                </svg>
                Google
              </a>
              <a
                href="#"
                class="inline-flex items-center justify-center gap-3 rounded-2xl bg-white px-4 py-3 text-sm font-semibold text-slate-700 ring-1 ring-slate-200 transition hover:bg-slate-50"
              >
                <svg
                  class="h-5 w-5 text-slate-950"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M10 2.08a8.13 8.13 0 0 0-2.56 15.84c.4.08.55-.17.55-.38v-1.48c-2.25.49-2.72-.96-2.72-.96-.36-.93-.89-1.18-.89-1.18-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.5-1.07-1.79-.2-3.67-.9-3.67-4a3.13 3.13 0 0 1 .83-2.17c-.08-.2-.36-1.03.08-2.14 0 0 .68-.22 2.23.83A7.64 7.64 0 0 1 10 6.13c.69 0 1.38.09 2.03.27 1.55-1.05 2.23-.83 2.23-.83.44 1.11.16 1.94.08 2.14.52.57.83 1.3.83 2.17 0 3.1-1.89 3.79-3.69 3.99.29.25.55.75.55 1.51v2.16c0 .21.14.46.56.38A8.13 8.13 0 0 0 10 2.08Z"
                  />
                </svg>
                GitHub
              </a>
            </div>

            <p class="mt-8 text-center text-sm text-slate-500">
              还没有账号？
              <a href="#" class="font-semibold text-[#377dff] hover:text-indigo-600">
                立即注册
              </a>
            </p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
