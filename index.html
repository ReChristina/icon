<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="宜宾智慧体育场馆响应式登录页，基于 Figma 设计稿使用 Tailwind CSS 实现"
    />
    <title>宜宾智慧体育场馆 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#15a8e8",
              ink: "#1d2736",
            },
            fontFamily: {
              sans: [
                "Microsoft YaHei",
                "PingFang SC",
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "sans-serif",
              ],
            },
            boxShadow: {
              card: "0 18px 45px rgba(58, 112, 164, 0.16)",
              field: "0 0 0 1px rgba(221, 234, 244, 0.9)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#f7fcff] font-sans text-ink antialiased">
    <main
      class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[radial-gradient(circle_at_38%_62%,rgba(197,232,255,0.8),transparent_31%),linear-gradient(180deg,#ffffff_0%,#eff9ff_100%)] px-4 py-6 md:p-0"
    >
      <section
        aria-labelledby="login-title"
        class="relative grid w-full max-w-[800px] overflow-hidden rounded-[2px] bg-white/20 px-0 py-8 md:min-h-[500px] md:grid-cols-[382px_1fr] md:items-center md:p-0"
      >
        <aside
          class="relative min-h-[260px] overflow-visible md:min-h-[500px]"
          aria-label="宜宾城市场馆视觉插画"
        >
          <svg
            class="absolute left-1/2 top-1/2 h-[280px] w-[448px] -translate-x-1/2 -translate-y-[48%] sm:h-[360px] sm:w-[576px] md:left-[-18px] md:top-[253px] md:h-[394px] md:w-[505px] md:-translate-x-0 md:-translate-y-1/2"
            viewBox="0 0 505 394"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-labelledby="city-illustration-title city-illustration-desc"
          >
            <title id="city-illustration-title">宜宾智慧体育场馆城市插画</title>
            <desc id="city-illustration-desc">
              蓝色调城市地标、高楼与体育场馆组合，呼应智慧体育场馆登录页设计。
            </desc>
            <defs>
              <linearGradient id="floor" x1="92" y1="278" x2="409" y2="384" gradientUnits="userSpaceOnUse">
                <stop stop-color="#e5f7ff" />
                <stop offset="0.5" stop-color="#7ad9ff" />
                <stop offset="1" stop-color="#2c8cff" />
              </linearGradient>
              <linearGradient id="floorEdge" x1="83" y1="288" x2="409" y2="388" gradientUnits="userSpaceOnUse">
                <stop stop-color="#bdefff" />
                <stop offset="1" stop-color="#167be5" />
              </linearGradient>
              <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
                <stop stop-color="#ffffff" />
                <stop offset="0.3" stop-color="#bce9ff" />
                <stop offset="1" stop-color="#278cff" />
              </linearGradient>
              <linearGradient id="glassDeep" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#f9fdff" />
                <stop offset="0.5" stop-color="#7bcfff" />
                <stop offset="1" stop-color="#005bff" />
              </linearGradient>
              <linearGradient id="stadium" x1="165" y1="254" x2="342" y2="322" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ffffff" />
                <stop offset="0.5" stop-color="#d9f7ff" />
                <stop offset="1" stop-color="#42a7ff" />
              </linearGradient>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#3aa3ff" flood-opacity="0.26" />
              </filter>
              <filter id="buildingGlow" x="-40%" y="-30%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="2.2" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <ellipse cx="242" cy="340" rx="214" ry="37" fill="#8ddfff" opacity="0.22" />
            <path
              d="M15 283 221 184l250 72-206 117L15 283Z"
              fill="url(#floor)"
              opacity="0.72"
            />
            <path d="M15 283v20l250 84v-14L15 283Z" fill="#67d8ff" opacity="0.6" />
            <path d="M265 373v14l206-117v-14L265 373Z" fill="url(#floorEdge)" opacity="0.72" />
            <path d="M16 283 221 184l250 72" stroke="#d9fbff" stroke-width="2" opacity="0.9" />

            <g filter="url(#buildingGlow)">
              <path d="M74 164 116 151l39 12v104l-40 15-41-12V164Z" fill="url(#glass)" opacity="0.9" />
              <path d="M116 151v130" stroke="#0f73ff" stroke-opacity="0.35" stroke-width="2" />
              <path d="M83 181h62M83 204h62M83 228h62M83 252h62" stroke="#ffffff" stroke-opacity="0.75" />

              <path d="M176 96 210 83l31 12v178l-31 16-34-13V96Z" fill="url(#glassDeep)" opacity="0.92" />
              <path d="M210 83v206" stroke="#0a72ff" stroke-opacity="0.38" stroke-width="2" />
              <path d="M184 120h47M184 150h47M184 181h47M184 212h47M184 242h47" stroke="#ffffff" stroke-opacity="0.65" />

              <path d="M296 124 330 108l26 14v162l-29 15-31-12V124Z" fill="url(#glass)" opacity="0.9" />
              <path d="M330 108v190" stroke="#0f73ff" stroke-opacity="0.34" stroke-width="2" />
              <path d="M303 151h45M303 178h45M303 206h45M303 235h45M303 262h45" stroke="#ffffff" stroke-opacity="0.66" />

              <path d="M379 154 420 130l20 17v114l-43 26-18-12V154Z" fill="url(#glass)" opacity="0.86" />
              <path d="M420 130v130" stroke="#0f73ff" stroke-opacity="0.32" stroke-width="2" />
            </g>

            <g opacity="0.98">
              <path d="M36 169h61l-8 14H44l-8-14Z" fill="#0c5fe8" />
              <path d="M42 183h49l-6 52H48l-6-52Z" fill="url(#glassDeep)" />
              <path d="M28 236h78l-10 14H38l-10-14Z" fill="#0557d6" />
              <path d="M20 251h96l-15 15H35l-15-15Z" fill="#0d70f2" />
              <path d="M29 147h75l-11 15H40l-11-15Z" fill="#0d70f2" />
              <path d="M37 127h61l-9 14H46l-9-14Z" fill="#0d70f2" />
              <path d="M46 109h43l-7 13H53l-7-13Z" fill="#0d70f2" />
              <path d="M55 92h25l-5 12H60l-5-12Z" fill="#0d70f2" />
              <path d="M67 64v29" stroke="#1266e8" stroke-width="3" stroke-linecap="round" />
              <path d="M67 55 74 69H60l7-14Z" fill="#1266e8" />
              <path d="M51 161h32M54 190h27M55 208h25M56 225h23" stroke="#ffffff" stroke-opacity="0.75" />
            </g>

            <g opacity="0.95">
              <path d="M135 142h5v125h-5V142Z" fill="#1e86ff" />
              <path d="M130 145h15l-7-30-8 30Z" fill="#68cfff" />
              <path d="M120 154h35l-17 8-18-8Z" fill="#0f72f2" />
              <circle cx="138" cy="106" r="7" fill="#48c9ff" />
              <path d="M138 56v50" stroke="#1d8cff" stroke-width="2" />
            </g>

            <g filter="url(#softShadow)">
              <path
                d="M144 271c0-33 48-61 108-61s108 28 108 61-48 58-108 58-108-25-108-58Z"
                fill="url(#stadium)"
              />
              <path
                d="M173 263c0-23 35-42 79-42s79 19 79 42-35 39-79 39-79-16-79-39Z"
                fill="#ffffff"
              />
              <path
                d="M192 257c0-14 27-25 60-25s60 11 60 25-27 24-60 24-60-10-60-24Z"
                fill="#1648d7"
                opacity="0.9"
              />
              <path
                d="M151 279c45 29 154 29 199 0v19c-46 31-153 31-199 0v-19Z"
                fill="#eaffff"
              />
              <path d="M164 299c48 19 128 19 176 0" stroke="#1685ec" stroke-width="4" opacity="0.7" />
              <path d="M178 310c45 14 104 14 148 0" stroke="#1685ec" stroke-width="3" opacity="0.55" />
            </g>

            <g opacity="0.96">
              <path d="M347 242 430 212l47 35-86 41-44-46Z" fill="#0a6df0" />
              <path d="M359 240 429 218l35 27-72 32-33-37Z" fill="#dff8ff" />
              <path d="M376 236h58M388 251h55M401 265h34" stroke="#44a7ff" stroke-width="2" opacity="0.75" />
            </g>
          </svg>
        </aside>

        <article
          class="relative z-10 mx-auto w-full max-w-[365px] rounded-[10px] bg-white px-[31px] pb-[8px] pt-[21px] shadow-card ring-1 ring-sky-50/80 md:mx-0 md:ml-[2px] md:mt-[3px]"
        >
          <header class="text-center">
            <h1 id="login-title" class="text-[17px] font-bold leading-6 tracking-[0.01em] text-[#111827]">
              欢迎登录宜宾智慧体育场馆
            </h1>
          </header>

          <div class="mt-[19px] grid gap-5 sm:grid-cols-[116px_1fr] sm:gap-[24px]">
            <section aria-labelledby="qr-title" class="text-center">
              <h2 id="qr-title" class="text-[14px] font-semibold leading-5 text-[#1d1d1f]">
                扫码登录
              </h2>
              <div
                class="mx-auto mt-[9px] grid h-[92px] w-[92px] grid-cols-[repeat(13,1fr)] gap-[2px] bg-white p-[2px] ring-1 ring-slate-100"
                aria-label="扫码登录二维码"
                role="img"
              >
                <span class="col-span-4 row-span-4 border-[5px] border-black"></span>
                <span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span>
                <span class="col-span-4 row-span-4 border-[5px] border-black"></span>
                <span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span>
                <span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span>
                <span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span></span>
                <span class="bg-black"></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span>
                <span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span></span>
                <span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span>
                <span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span></span>
                <span class="col-span-4 row-span-4 border-[5px] border-black"></span>
                <span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span>
                <span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span class="bg-black"></span>
                <span class="bg-black"></span><span></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span>
                <span></span><span class="bg-black"></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span><span></span><span class="bg-black"></span>
              </div>
              <p class="mt-[10px] text-[10px] leading-4 text-[#8e9aaa]">打开APP点击扫一扫</p>
            </section>

            <form class="pt-[1px]" action="#" method="post">
              <div class="space-y-[9px]">
                <div class="relative">
                  <label for="account" class="sr-only">账号</label>
                  <span
                    class="pointer-events-none absolute left-[9px] top-1/2 -translate-y-1/2 text-brand"
                    aria-hidden="true"
                  >
                    <svg class="h-[13px] w-[13px]" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M8 8.2a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z" stroke="currentColor" stroke-width="1.5" />
                      <path d="M2.7 14c.5-2.7 2.4-4.2 5.3-4.2s4.8 1.5 5.3 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                  </span>
                  <input
                    id="account"
                    name="account"
                    type="text"
                    autocomplete="username"
                    placeholder="请输入账号"
                    class="h-[26px] w-full rounded-[3px] border-0 bg-white pl-[28px] pr-2 text-[10px] text-slate-800 shadow-field outline-none transition placeholder:text-[#c9d1d9] focus:ring-1 focus:ring-brand"
                  />
                </div>

                <div class="relative">
                  <label for="password" class="sr-only">密码</label>
                  <span
                    class="pointer-events-none absolute left-[9px] top-1/2 -translate-y-1/2 text-brand"
                    aria-hidden="true"
                  >
                    <svg class="h-[13px] w-[13px]" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M4.2 6.8V5.4a3.8 3.8 0 0 1 7.6 0v1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                      <path d="M3.5 6.8h9A1.5 1.5 0 0 1 14 8.3v4.2a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5V8.3a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.4" />
                    </svg>
                  </span>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入密码"
                    class="h-[26px] w-full rounded-[3px] border-0 bg-white pl-[28px] pr-2 text-[10px] text-slate-800 shadow-field outline-none transition placeholder:text-[#c9d1d9] focus:ring-1 focus:ring-brand"
                  />
                </div>

                <div class="flex items-center gap-[13px]">
                  <div class="relative min-w-0 flex-1">
                    <label for="captcha" class="sr-only">验证码</label>
                    <span
                      class="pointer-events-none absolute left-[9px] top-1/2 -translate-y-1/2 text-brand"
                      aria-hidden="true"
                    >
                      <svg class="h-[13px] w-[13px]" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2.2 13 4v3.7c0 3.1-2 5.2-5 6.1-3-.9-5-3-5-6.1V4l5-1.8Z" stroke="currentColor" stroke-width="1.3" />
                        <path d="m5.7 8 1.5 1.5 3.2-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </span>
                    <input
                      id="captcha"
                      name="captcha"
                      type="text"
                      inputmode="numeric"
                      value="03219"
                      aria-describedby="captcha-code"
                      class="h-[26px] w-full rounded-[3px] border-0 bg-white pl-[28px] pr-2 text-[10px] text-slate-700 shadow-[0_0_0_1px_#16bac5] outline-none focus:ring-1 focus:ring-[#16bac5]"
                    />
                  </div>
                  <strong
                    id="captcha-code"
                    class="select-none text-[19px] font-bold leading-none tracking-[0.04em] text-[#202733]"
                  >
                    03219
                  </strong>
                </div>
              </div>

              <label class="mt-[8px] flex items-center gap-[5px] text-[10px] leading-4 text-[#a5adb6]">
                <input
                  type="checkbox"
                  name="remember"
                  class="h-[9px] w-[9px] rounded-[1px] border-[#dfe8ee] text-brand focus:ring-brand"
                />
                记住密码
              </label>

              <button
                type="submit"
                class="mt-[7px] h-[26px] w-full rounded-[3px] bg-brand text-[12px] font-normal leading-[26px] text-white shadow-[0_5px_11px_rgba(21,168,232,0.23)] transition hover:bg-[#0e9bdd] focus:outline-none focus:ring-2 focus:ring-brand/30"
              >
                登录
              </button>
            </form>
          </div>

          <p class="mt-[11px] text-center text-[9px] leading-4 text-[#99a4af]">
            登录代表您已阅读并同意
            <a href="#" class="text-[#6e98b6] hover:text-brand">隐私协议</a>
            和
            <a href="#" class="text-[#6e98b6] hover:text-brand">使用条款</a>
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
